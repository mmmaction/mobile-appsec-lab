name: OpenSSF Scorecard

# Badge: https://api.scorecard.dev/projects/github.com/mmmaction/mobile-appsec-lab/badge
# Viewer: https://scorecard.dev/viewer/?uri=github.com/mmmaction/mobile-appsec-lab
#
# Requires: repo must be public (publish_results: true uploads to public DB).

on:
  push:
    branches: [main]
  schedule:
    # Weekly re-scan every Monday 07:30 UTC (offset from pipeline.yml to avoid queue contention)
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: "OpenSSF Scorecard"
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to GitHub Security tab
      id-token: write          # required for publish_results: true
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true   # powers the scorecard.dev badge

      - name: Upload Scorecard SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: openssf-scorecard
