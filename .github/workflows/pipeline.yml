name: Mobile AppSec Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan (Trivy vuln DB refresh) every Monday 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Force Node.js 24 for all actions (Node.js 20 deprecated from June 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: hello_app

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 · LINT
# Tools: flutter analyze, dart format --check, dart_code_metrics
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # flutter analyze = static lint (security rules included)
      - name: flutter analyze
        run: flutter analyze --no-pub

      # dart format --set-exit-if-changed = fails if any file would be reformatted
      - name: dart format check
        run: dart format --set-exit-if-changed .

      # dart_code_metrics for extended rule set
      - name: dart_code_metrics
        continue-on-error: true   # does not block pipeline
        run: |
          dart pub global activate dart_code_metrics
          dart pub global run dart_code_metrics:metrics analyze lib

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 · BUILD + SBOM
# Tools: flutter build web, flutter build apk, Trivy (CycloneDX), Syft (CycloneDX)
# Both SBOM jobs run in parallel after lint and upload separate artifacts.
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Build + SBOM (Trivy)"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java (required for Android build)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK (debug – no signing required)
        run: flutter build apk --debug

      # Generate SBOM with Trivy in CycloneDX format
      # SBOM covers: Dart/pub dependencies + OS packages in build env
      # scanners: vuln,license ensures license metadata is embedded in the SBOM
      # so that the downstream "Trivy · License Check" step has data to report
      - name: Generate SBOM (Trivy · CycloneDX JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: hello_app
          scanners: vuln,license
          format: cyclonedx
          output: sbom.cdx.json
        # Override working-directory — trivy-action runs from repo root
        env:
          TRIVY_SKIP_DB_UPDATE: "false"

      # Upload SBOM so the SAST/SCA stage can consume it
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-outputs
          path: |
            hello_app/build/web/
            hello_app/build/app/outputs/flutter-apk/
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2b · SBOM (Syft · CycloneDX JSON) — runs in parallel with build
# Anchore Syft scans the source tree for Dart/pub packages and produces a
# CycloneDX JSON SBOM that can be fed to Grype or any CycloneDX-aware tool.
# Runs after lint (same dependency as build) so the two SBOM jobs are parallel.
# ─────────────────────────────────────────────────────────────────────────────
  build-sbom-syft:
    name: "SBOM · Syft"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.lock must exist for Syft to enumerate pub dependencies
      - name: Install dependencies
        run: flutter pub get
        working-directory: hello_app

      - name: Generate SBOM (Syft · CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: hello_app
          format: cyclonedx-json
          output-file: sbom-syft.cdx.json
          artifact-name: sbom-syft

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 · UNIT TEST
# Tools: flutter test --coverage, lcov
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "Unit Test"
    runs-on: ubuntu-latest
    needs: lint   # runs in parallel with build after lint passes

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      # Requires CODECOV_TOKEN secret (free for public repos at codecov.io)
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true   # does not block pipeline
        with:
          files: hello_app/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: hello_app/coverage/
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 · SAST
# One SAST tool — CodeQL does NOT support Dart (unsupported language).
#   sast-semgrep → Semgrep pattern-based security analysis (Dart/Flutter rules)
#
# SAST comparison results (lab findings — hello_app demo code):
#   Semgrep: 0 findings — no security patterns triggered in demo code
# (Expected: demo code is minimal; real findings appear with auth/crypto code)
# ─────────────────────────────────────────────────────────────────────────────
  sast-semgrep:
    name: "SAST · Semgrep"
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Pattern-based security analysis — Dart/Flutter rules via config:auto
      # Set SEMGREP_APP_TOKEN secret to send results to Semgrep dashboard.
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        continue-on-error: true   # does not block pipeline
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN || '' }}

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4a · SCA — osv-scanner (Dart/pub CVE)
# Primary CVE gate. Uses the OSV database — same source as flutter pub get
# advisory warnings. First-class Dart/pub ecosystem coverage.
#
# Lab result: 1 CVE (GHSA-vm9r-h74p-hg97, jose 0.3.5, High) — see README.
# ─────────────────────────────────────────────────────────────────────────────
  scan-osv:
    name: "Scan · osv-scanner"
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # go install is the most reliable install method in CI (Go is pre-installed
      # on ubuntu-latest). Avoids fragile curl+binary asset-name assumptions.
      - name: Install osv-scanner
        run: |
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: osv-scanner · Dart/pub Vulnerability Scan
        working-directory: ${{ github.workspace }}
        run: osv-scanner scan --lockfile=hello_app/pubspec.lock
        continue-on-error: true   # set to false to block pipeline on findings

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4b · SCA — Trivy (SBOM vuln + license)
# Intentionally kept for comparison and to surface results in GitHub Security tab.
#
# DOCUMENTED LIMITATION: Trivy has NO Dart/pub ecosystem support:
#   - CVE scan:     0 results (false negative — GHSA-vm9r-h74p-hg97 not in Trivy pub DB)
#   - License scan: ‘-’ (Not scanned — Trivy cannot extract license data from pub packages)
# Both are Trivy ecosystem gaps, not stale DB issues. DB is refreshed daily.
# Use scan-osv for CVEs and scan-pub-license for license compliance.
# exit-code: 0 on all steps — cannot gate on Trivy results for Dart/pub.
# ─────────────────────────────────────────────────────────────────────────────
  scan-trivy:
    name: "Scan · trivy"
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      security-events: write   # required to upload SARIF to GitHub Security tab
      contents: read

    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      # KNOWN LIMITATION: Trivy Dart/pub DB does not include GHSA-vm9r-h74p-hg97.
      # Kept for SARIF upload to GitHub Security tab and cross-ecosystem comparison.
      # exit-code: 0 — cannot gate on this result for Dart/pub.
      - name: Trivy · Vulnerability Scan (via SBOM)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom/sbom.cdx.json
          format: sarif
          output: trivy-vuln.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"   # cannot gate — Trivy has no pub CVE coverage

      - name: Upload Trivy vuln results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy-vulnerabilities

      # KNOWN LIMITATION: Trivy reports '-' (Not scanned) for pub license data.
      # Use scan-pub-license job for actual Dart/pub license compliance.
      - name: Trivy · License Check (via SBOM)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom/sbom.cdx.json
          scanners: license
          format: table
          exit-code: "0"   # cannot gate — Trivy has no pub license coverage

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4d · SCA — license_finder (Dart/pub license compliance)
# Ruby gem by Pivotal. Reads pubspec.lock, resolves licenses from pub cache.
# Requires flutter pub get first to populate ~/.pub-cache with package files.
# Known limitation: packages without a LICENSE file in their pub cache dir
# show as 'unknown' — this reflects poor package metadata, not a tool bug.
# continue-on-error: true — unknown results are informational, not blocking.
# ─────────────────────────────────────────────────────────────────────────────
  scan-license-finder:
    name: "Scan · license_finder"
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install license_finder
        run: sudo gem install license_finder

      - name: license_finder · License Report
        run: |
          export PUB_CACHE="$HOME/.pub-cache"
          # Report all licenses — 'unknown' means package has no LICENSE file in pub cache
          license_finder report --format=csv
        continue-on-error: true   # unknown results are informational; remove to block on unapproved licenses

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4c · SCA — Gitleaks (secret scanning)
# Scans full git history for credentials, tokens, and API keys.
# ─────────────────────────────────────────────────────────────────────────────
  scan-gitleaks:
    name: "Scan · Gitleaks"
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0   # full history needed for Gitleaks

      # Using CLI directly: gitleaks-action@v2 accepts no inputs, so we cannot
      # pass --log-opts="--all" via the action. CLI gives full control.
      # --all scans the full git history (not just the current push event).
      - name: Install Gitleaks
        run: |
          VERSION=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp

      - name: Gitleaks · Secret Scanning
        working-directory: ${{ github.workspace }}
        run: /tmp/gitleaks detect --redact -v --log-opts="--all" --exit-code=2
        continue-on-error: true   # set to false to block pipeline on any leak

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4e · SCA — Dependency-Track (continuous monitoring)
# Uploads SBOM to OWASP Dependency-Track for continuous CVE re-scanning.
#
# DOCUMENTED LIMITATION (lab result 2026-05-08):
#   - 42 pub components ingested correctly (pkg:pub PURLs recognised)
#   - 0 CVEs found for jose 0.3.5 (GHSA-vm9r-h74p-hg97)
#   - Root cause: advisory not yet in NVD/OSS Index with matching pkg:pub PURL
#   - osv-scanner and grype both find it — DT lags behind for pub advisories
# Value: continuous re-scanning; will self-update when NVD/OSS Index propagates.
# Requires secrets: DT_URL, DT_API_KEY (see docker-compose.yml for local setup)
# ─────────────────────────────────────────────────────────────────────────────
  scan-deptrack:
    name: "Scan · Dependency-Track"
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Upload SBOM to Dependency-Track
        run: |
          # DOCUMENTED LIMITATION: 0 CVEs expected for pub packages (NVD/OSS Index lag)
          # See README CVE Scanner Comparison for details.
          curl -sf \
            --request PUT \
            --url "${{ secrets.DT_URL }}/api/v1/bom" \
            --header "X-Api-Key: ${{ secrets.DT_API_KEY }}" \
            --header "Content-Type: multipart/form-data" \
            --form "autoCreate=true" \
            --form "projectName=mobile-appsec-lab" \
            --form "projectVersion=${{ github.ref_name }}" \
            --form "bom=@sbom/sbom.cdx.json" \
          || echo "DT upload skipped — DT_URL/DT_API_KEY not configured"
        continue-on-error: true   # external system; never block pipeline

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4e · SCA — Grype (Syft SBOM vulnerability scan)
# Anchore Grype consumes the Syft-generated SBOM. Grype uses the GitHub
# Advisory Database (GHSA) and correctly detects GHSA-vm9r-h74p-hg97
# (jose 0.3.5, High) — confirmed in local evaluation.
# Runs in parallel with other scan jobs after build-sbom-syft + test complete.
# continue-on-error: true — informational; osv-scanner is the primary CVE gate.
# ─────────────────────────────────────────────────────────────────────────────
  scan-grype:
    name: "Scan · Grype"
    runs-on: ubuntu-latest
    needs: [build-sbom-syft, test]

    steps:
      - name: Download Syft SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-syft
          path: sbom-syft/

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
        working-directory: ${{ github.workspace }}

      - name: Grype · Vulnerability Scan (via Syft SBOM)
        run: grype sbom:sbom-syft/sbom-syft.cdx.json --output table
        working-directory: ${{ github.workspace }}
        # Grype exits 0 by default (no --fail-on flag) — informational only.
        # To make this a blocking gate, add: --fail-on high
        continue-on-error: true      # does not block pipeline

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 5 · PACKAGE
# Publish SBOM as release artifact (CRA Annex I requirement)
# ─────────────────────────────────────────────────────────────────────────────
  package:
    name: "Package"
    runs-on: ubuntu-latest
    needs: [sast-semgrep, scan-osv, scan-trivy, scan-license-finder, scan-gitleaks, scan-deptrack, scan-grype]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-outputs
          path: build-outputs/

      # Archive SBOM alongside release artifacts (CRA Annex I)
      - name: Publish SBOM + build as GitHub release asset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: |
            sbom/sbom.cdx.json
            build-outputs/
          retention-days: 90   # max allowed by repo settings; extend in repo Settings → Actions
