name: Mobile AppSec Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan (Trivy vuln DB refresh) every Monday 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Force Node.js 24 for all actions (Node.js 20 deprecated from June 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: hello_app

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 · LINT
# Tools: flutter analyze, dart format --check, dart_code_metrics
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # flutter analyze = static lint (security rules included)
      - name: flutter analyze
        run: flutter analyze --no-pub

      # dart format --set-exit-if-changed = fails if any file would be reformatted
      - name: dart format check
        run: dart format --set-exit-if-changed .

      # dart_code_metrics for extended rule set
      - name: dart_code_metrics
        continue-on-error: true   # does not block pipeline
        run: |
          dart pub global activate dart_code_metrics
          dart pub global run dart_code_metrics:metrics analyze lib

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 · BUILD + SBOM
# Tools: flutter build web, flutter build apk, Trivy (CycloneDX)
# SBOM is passed as artifact to SAST/SCA stage
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Build + SBOM"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java (required for Android build)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK (debug – no signing required)
        run: flutter build apk --debug

      # Generate SBOM with Trivy in CycloneDX format
      # SBOM covers: Dart/pub dependencies + OS packages in build env
      # scanners: vuln,license ensures license metadata is embedded in the SBOM
      # so that the downstream "Trivy · License Check" step has data to report
      - name: Generate SBOM (Trivy · CycloneDX JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: hello_app
          scanners: vuln,license
          format: cyclonedx
          output: sbom.cdx.json
        # Override working-directory — trivy-action runs from repo root
        env:
          TRIVY_SKIP_DB_UPDATE: "false"

      # Upload SBOM so the SAST/SCA stage can consume it
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-outputs
          path: |
            hello_app/build/web/
            hello_app/build/app/outputs/flutter-apk/
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 · UNIT TEST
# Tools: flutter test --coverage, lcov
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "Unit Test"
    runs-on: ubuntu-latest
    needs: lint   # runs in parallel with build after lint passes

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      # Requires CODECOV_TOKEN secret (free for public repos at codecov.io)
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true   # does not block pipeline
        with:
          files: hello_app/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: hello_app/coverage/
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 · SAST
# Two SAST tools run in parallel — results compared in README SAST Comparison.
#   sast-semgrep → Semgrep pattern-based security analysis (Dart/Flutter rules)
#   sast-codeql  → GitHub CodeQL dataflow/taint analysis (Dart, experimental)
#
# SAST comparison results (lab findings — hello_app demo code):
#   Semgrep: 0 findings — no security patterns triggered in demo code
#   CodeQL:  0 findings — no taint/dataflow issues in demo code
# (Expected: demo code is minimal; real findings appear with auth/crypto code)
# ─────────────────────────────────────────────────────────────────────────────
  sast-semgrep:
    name: "SAST · Semgrep"
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Pattern-based security analysis — Dart/Flutter rules via config:auto
      # Set SEMGREP_APP_TOKEN secret to send results to Semgrep dashboard.
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        continue-on-error: true   # does not block pipeline
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN || '' }}

# ─────────────────────────────────────────────────────────────────────────────
# SAST — CodeQL (Dart)
# GitHub-native dataflow/taint analysis. Free for public repos.
# Stronger than Semgrep: multi-hop injection, auth bypass, unsafe deserialization.
# Dart support: experimental — continue-on-error set for safety.
# ─────────────────────────────────────────────────────────────────────────────
  sast-codeql:
    name: "SAST · CodeQL (Dart)"
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true   # Dart support is experimental
        with:
          category: codeql-dart

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4a · SCA — osv-scanner (Dart/pub CVE)
# Primary CVE gate. Uses the OSV database — same source as flutter pub get
# advisory warnings. First-class Dart/pub ecosystem coverage.
#
# Lab result: 1 CVE (GHSA-vm9r-h74p-hg97, jose 0.3.5, High) — see README.
# ─────────────────────────────────────────────────────────────────────────────
  scan-osv:
    name: "Scan · osv-scanner"
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # go install is the most reliable install method in CI (Go is pre-installed
      # on ubuntu-latest). Avoids fragile curl+binary asset-name assumptions.
      - name: Install osv-scanner
        run: |
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: osv-scanner · Dart/pub Vulnerability Scan
        working-directory: ${{ github.workspace }}
        run: osv-scanner scan --lockfile=hello_app/pubspec.lock
        continue-on-error: true   # set to false to block pipeline on findings

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4b · SCA — Trivy (SBOM vuln + license)
# Intentionally kept for comparison and license scanning.
#
# LIMITATION: Trivy's Dart/pub CVE coverage lags OSV — GHSA-vm9r-h74p-hg97
# is not yet in Trivy's DB. Use for license compliance, not as CVE gate.
# Lab result: 0 CVEs (documented false negative vs osv-scanner). exit-code: 0.
# ─────────────────────────────────────────────────────────────────────────────
  scan-trivy:
    name: "Scan · trivy (+ license)"
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      security-events: write   # required to upload SARIF to GitHub Security tab
      contents: read

    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      # Complements osv-scanner: broader ecosystem coverage + SARIF output
      # exit-code: 0 — Trivy Dart/pub DB lags; cannot gate on this result.
      - name: Trivy · Vulnerability Scan (via SBOM)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom/sbom.cdx.json
          format: sarif
          output: trivy-vuln.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"   # set to 1 to break pipeline on findings

      - name: Upload Trivy vuln results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy-vulnerabilities

      - name: Trivy · License Check (via SBOM)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom/sbom.cdx.json
          scanners: license
          format: table
          exit-code: "0"   # set to 1 to enforce license policy

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4c · SCA — Gitleaks (secret scanning)
# Scans full git history for credentials, tokens, and API keys.
# ─────────────────────────────────────────────────────────────────────────────
  scan-gitleaks:
    name: "Scan · Gitleaks"
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0   # full history needed for Gitleaks

      # Using CLI directly: gitleaks-action@v2 accepts no inputs, so we cannot
      # pass --log-opts="--all" via the action. CLI gives full control.
      # --all scans the full git history (not just the current push event).
      - name: Install Gitleaks
        run: |
          VERSION=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp

      - name: Gitleaks · Secret Scanning
        working-directory: ${{ github.workspace }}
        run: /tmp/gitleaks detect --redact -v --log-opts="--all" --exit-code=2
        continue-on-error: true   # set to false to block pipeline on any leak

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 5 · PACKAGE
# Publish SBOM as release artifact (CRA Annex I requirement)
# ─────────────────────────────────────────────────────────────────────────────
  package:
    name: "Package"
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sast-codeql, scan-osv, scan-trivy, scan-gitleaks]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-outputs
          path: build-outputs/

      # Archive SBOM alongside release artifacts (CRA Annex I)
      - name: Publish SBOM + build as GitHub release asset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: |
            sbom/sbom.cdx.json
            build-outputs/
          retention-days: 90   # max allowed by repo settings; extend in repo Settings → Actions
